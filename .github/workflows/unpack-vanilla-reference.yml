name: Unpack vanilla stock reference

# Intentionally manual-only. The reference archive is not part of normal CI
# and this workflow never runs on ordinary pushes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-vanilla-stock-reference
  cancel-in-progress: false

jobs:
  extract-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run idempotent reference extractor
        run: python3 tools/extract_vanilla_reference.py

      - name: Commit extracted reference files (reference-only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/vanilla-stock
          if git diff --cached --quiet; then
            echo "No reference changes to commit."
          else
            git commit -m "Extract vanilla stock reference archive"
            git push origin HEAD:main
          fi
