name: check

# Nothing here can run Minecraft, so this is what stands in for a build: the
# static checks run on every push, and the installable pack is assembled to prove
# it still assembles. A shader that fails these checks is a shader that is likely
# to make the game drop every selected resource pack.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the pack
        run: python3 tools/check_pack.py

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compile shader stages and supported variants
        run: python3 tools/compile_glsl.py

      - name: Check manifests on pull requests
        if: github.event_name == 'pull_request'
        run: python3 tools/manifest.py --check

      - name: Build the installable pack
        run: python3 tools/package.py --zip

      - name: Verify the archive has pack.mcmeta at its root
        run: |
          python3 - <<'PY'
          import sys, zipfile, glob
          archives = glob.glob('dist/*.zip')
          if not archives:
              sys.exit('no .zip was built')
          with zipfile.ZipFile(archives[0]) as handle:
              names = handle.namelist()
          required = ['pack.mcmeta', 'assets/minecraft/post_effect/end_of_frame.json']
          for entry in required:
              if entry not in names:
                  sys.exit('%s is not at the archive root; names: %s' % (entry, names[:10]))
          leaked = [n for n in names if n.startswith(('Good working shader/', 'Vanilla-stock', '.research/', 'tools/'))]
          if leaked:
              sys.exit('the archive carries material that must not be redistributed: %s' % leaked[:5])
          print('%s entries checked, pack.mcmeta at the root, nothing leaked' % len(names))
          PY

      - name: Upload the pack
        uses: actions/upload-artifact@v4
        with:
          name: native-vanilla-shaders
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Alpha release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.${{ github.run_number }}.${{ github.run_attempt }}
          name: Native Vanilla Shaders v0.1.0-alpha.${{ github.run_number }}.${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh manifests on main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: python3 tools/manifest.py --write

      - name: Commit refreshed manifests
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Multiple quick pushes can finish their checks at the same time.
          # Rebase the generated metadata onto the latest main and regenerate
          # against that exact tree before pushing, retrying if main moves again.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/manifest.py --write
            git add MANIFEST/vanilla-hashes.json MANIFEST/modified-files.json
            if git diff --cached --quiet; then
              echo "Manifests are already current."
              exit 0
            fi
            git commit -m "Refresh shader manifests"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during manifest push; retrying."
          done
          echo "Could not push manifest refresh after three attempts."
          exit 1

